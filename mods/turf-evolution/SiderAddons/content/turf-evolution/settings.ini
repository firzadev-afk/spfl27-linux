; TURF EVOLUTION v2.4 - close PES and Sider before editing.
; Settings apply after restarting both PES and Sider.

; Green/brown mix: 0 = green short grass, 100 = exposed brown ground.
percent = 30
; Stamp strength: 100 = strongest; lower values weaken all stamps, not their count.
marks_strength = 50
; Ground color contrast: 100 = previous appearance, lower = subtler ground color.
marks_visibility = 100

; 150 static clumps: 1 = ON, 0 = OFF.
clumps_enabled = 1
; Shared Stadion009 grass model/texture: 1 = ON, 0 = OFF.
global_grass_enabled = 1
; Optional custom shader package; relative paths start in the Sider folder.
base_fsop =

; Optional PitchCrew repair. Requires the supplied ReShade add-on.
repair_enabled = 1
repair_percent = 75
repair_mode = patch
repair_cell = 8
repair_delay = 5
repair_duration = 0

; Unique key names: A-Z, 0-9, F1-F12, named keys, decimal VK, or NONE.
key_brown_less = MINUS
key_brown_more = PLUS
key_marks_less = LBRACKET
key_marks_more = RBRACKET
key_visibility_less = F8
key_visibility_more = F9
key_clumps = C
key_global_grass = T
key_repair_toggle = H
key_repair_now = G
